{% extends "base.html" %}
{% block title %}Graph · mynotes{% endblock %}
{% block head %}
{% if CYTOSCAPE_SRC %}<script src="{{ CYTOSCAPE_SRC }}" defer></script>{% endif %}
<script src="{{ asset('graph.js') }}" defer></script>
{% endblock %}
{% block content %}
<h1>Graph explorer</h1>
<div class="form-row">
  <input type="search" name="q" id="entity-q" value="{{ q }}" placeholder="Find an entity…"
         hx-get="/ui/partials/entity-panel" hx-target="#entity-panel"
         hx-trigger="input changed delay:400ms, search" hx-include="this"
         hx-indicator="#entity-indicator">
  <span id="entity-indicator" class="htmx-indicator">Searching…</span>
</div>
<div id="entity-panel">
  {% include "partials/entity_panel_body.html" %}
</div>
{% endblock %}

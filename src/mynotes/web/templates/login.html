{% extends "base.html" %}
{% block title %}Sign in · mynotes{% endblock %}
{% block content %}
<section class="login-card">
  <h1>Sign in</h1>
  <p>Paste the personal token your mynotes administrator gave you. It is kept in this browser only.</p>
  {% if error %}<p class="problem login-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" class="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">Personal token</label>
    <input type="password" id="token" name="token" autocomplete="off" autofocus required
           placeholder="mn_…">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}

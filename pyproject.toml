[project]
name = "mynotes"
version = "0.4.0rc9"
description = "Ask questions about a folder of notes: local RAG with hybrid search, citations, versions and a knowledge graph."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Manuel Alves" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer",
    "rich",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "platformdirs>=4.11.12",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.54",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "opensearch-py>=3.2.0",
    "pathspec>=1.1.1",
    "blake3>=1.0.9",
    "python-frontmatter>=1.3.0",
    "markdown-it-py>=4.2.0",
    "lingua-language-detector>=2.2.0",
    "pymupdf==1.26.7",
    "pymupdf4llm==0.2.9",
    "tokenizers>=0.23.2",
    "tiktoken>=0.14.0",
    "croniter>=6.2.4",
    "watchfiles>=1.3.0",
    "datasketch>=2.0.0",
    "markitdown[docx,pptx,xlsx]>=0.1.8",
    "networkx>=3.7",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
    "mcp<2",
    "jinja2>=3.1.6",
    "pyjwt[crypto]>=2.15.0",
]

[project.urls]
Source = "https://github.com/alvesman/znotes"

[project.scripts]
mynotes = "mynotes.cli:app"

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "psutil>=7.2.2",
    "pytest",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "ruff",
    "testcontainers[opensearch,postgres]>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mynotes"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "eval", "scripts"]
# Ruff 0.16+ includes *.md by default and would reformat Python code blocks
# in PLAN.md and tasks/*.md; those documents must stay untouched.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration and not live'"
markers = [
    "integration: needs Docker (testcontainers Postgres/OpenSearch)",
    "live: calls real model endpoints; needs MYNOTES_LIVE_TESTS=1",
    "watcher: filesystem watcher tests that run on every OS (no Docker)",
]
